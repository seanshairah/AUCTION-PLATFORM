name: Database schema

on:
  push:
    paths: ['db/**', '.github/workflows/db.yml']
  pull_request:
    paths: ['db/**', '.github/workflows/db.yml']

jobs:
  invariants:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Load schema and run invariant tests
        run: db/tests/run.sh 2>&1 | tee test.log
      - name: Check every test passed
        run: |
          grep -q "ALL INVARIANT TESTS PASSED" test.log
          echo "$(grep -c 'NOTICE:  PASS' test.log) checks passed"
